<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>査察コマンダー｜立入検査トレーニングゲーム</title>
<meta name="description" content="消防の立入検査（査察）を、証言追及と議論で学ぶ学習ゲーム。別表第一・防火管理・消防用設備等の基準を12のケースで体験できます。">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0D1424">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="査察コマンダー">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=M+PLUS+1+Code:wght@500;700&display=swap">
<style>
/* レイアウト：スマホ1画面のADV形式。上に状態バー、中央が舞台、下に会話ウィンドウ。夜の査問ステージを意図した単一ダークテーマ。蛍光イエロー＝疑わしい言葉、朱＝是正 */
:root{
  color-scheme:dark;
  --bg:#0D131F; --bg2:#152036; --panel:#1A2740; --ink:#EEF2F8; --muted:#8C9AB0; --line:#2C3B57;
  --weak:#FFD23F; --weakfg:#14100A; --seal:#FF4B2E; --ok:#3DDC97; --navy:#5B8DEF;
  --f-disp:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --f-code:"M PLUS 1 Code",ui-monospace,"Menlo",monospace;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--weak);outline-offset:2px}
.app{max-width:560px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding-inline:16px;padding-block:8px 12px;gap:6px}
.bar{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.bar .ttl{font-family:var(--f-disp);font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;letter-spacing:.04em;margin-right:auto;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--line);border-radius:999px;padding:2px 8px;font-size:12px;background:var(--panel);white-space:nowrap}
.hearts i{display:inline-block;width:9px;height:9px;background:var(--seal);transform:rotate(45deg);margin:0 2px;border-radius:1px}
.hearts i.off{background:var(--line)}
.chapline{min-width:0;font-family:var(--f-code);font-size:11px;color:var(--muted);letter-spacing:.1em;flex:0 0 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage{flex:1;position:relative;min-height:0;display:flex;flex-direction:column;gap:10px;overflow-y:auto;overflow-x:hidden;padding-bottom:12px}
.stage.fixed{overflow:hidden;padding-bottom:0}
.panel{background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:14px;min-width:0}
h2{font-family:var(--f-disp);font-size:20px;margin:0;line-height:1.3;text-wrap:balance;font-weight:400}
.eyebrow{font-family:var(--f-code);font-size:11.5px;letter-spacing:.14em;color:var(--seal);font-weight:700}
.btn{border:none;border-radius:10px;padding:12px 16px;background:var(--navy);color:#fff;font-weight:700;font-size:15px}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.seal{background:var(--seal)}
.btn.weak{background:var(--weak);color:var(--weakfg)}
.btn[disabled]{opacity:.35;cursor:default}
.ctrl{display:flex;gap:8px;flex-wrap:wrap}
.ctrl .grow{flex:1}
.fb{border-left:4px solid var(--ok);padding:8px 12px;background:var(--bg2);border-radius:4px;font-size:14.5px}
.fb.bad{border-left-color:var(--seal)}
.fb.neu{border-left-color:var(--line)}

/* ===== ADV会話 ===== */
.scene-bg{position:absolute;inset:0;border-radius:12px;overflow:hidden;background:
  radial-gradient(120% 70% at 50% 0%,color-mix(in srgb,var(--c,var(--navy)) 35%,transparent),transparent 70%),
  repeating-linear-gradient(135deg,transparent 0 22px,rgba(255,255,255,.025) 22px 23px),var(--bg2)}
.scene-bg.photo{background:linear-gradient(180deg,rgba(13,19,31,.15),rgba(13,19,31,.35) 55%,rgba(13,19,31,.8)),var(--bgi) center/cover no-repeat}
.arena.photo{background:linear-gradient(rgba(13,19,31,.72),rgba(13,19,31,.82)),repeating-conic-gradient(from 0deg at 50% 45%,rgba(255,255,255,.04) 0 6deg,transparent 6deg 12deg),var(--bgi) center/cover no-repeat}
.logo.photo{background:linear-gradient(100deg,rgba(13,19,31,.95) 35%,rgba(13,19,31,.45)),var(--bgi) 70% 35%/cover no-repeat}
.loc{position:absolute;left:12px;top:10px;font-family:var(--f-code);font-size:11px;letter-spacing:.1em;color:var(--muted);background:rgba(0,0,0,.35);padding:2px 8px;border-radius:4px}
.por{position:absolute;left:50%;top:14%;transform:translateX(-50%);width:min(52%,210px);aspect-ratio:3/4;border-radius:18px 18px 4px 4px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 85%,#fff 15%),var(--c));display:grid;place-items:center;
  font-family:var(--f-disp);font-size:72px;color:rgba(255,255,255,.92);box-shadow:0 18px 40px rgba(0,0,0,.45);animation:porIn .35s cubic-bezier(.2,1.3,.4,1)}
.por img{width:100%;height:100%;object-fit:cover;border-radius:inherit}
.por.img{background:none;box-shadow:none;border-radius:0;aspect-ratio:auto;width:min(92%,380px);top:2%;bottom:var(--pb,64px);display:flex;align-items:flex-end;justify-content:center}
.por.img img{object-fit:contain;object-position:bottom center;border-radius:0;filter:drop-shadow(0 12px 22px rgba(0,0,0,.55))}
.bigpor{position:absolute;right:-6%;bottom:0;height:78%;width:62%;opacity:.32;pointer-events:none}
.bigpor img{width:100%;height:100%;object-fit:contain;object-position:bottom right;filter:saturate(.7)}
.speaker .f img,.who .f img,.senpai .f img{width:100%;height:100%;object-fit:cover;object-position:50% 6%}
.senpai .f img{width:100%;height:100%;object-fit:cover}
@keyframes porIn{from{transform:translate(-50%,24px);opacity:0}}
.talkbox{position:absolute;left:0;right:0;bottom:0;background:rgba(10,15,26,.94);border:2px solid var(--c,var(--line));border-radius:12px;padding:18px 16px 26px;min-height:132px;cursor:pointer}
.talkbox .name{position:absolute;top:-14px;left:14px;background:var(--c,var(--navy));color:#fff;font-weight:900;font-size:13.5px;padding:2px 12px;border-radius:6px}
.talkbox .line{margin:0;font-size:16.5px;font-weight:500;line-height:1.75;min-height:3.5em}
.talkbox.narr{border-color:var(--line)}
.talkbox.narr .line{color:#C9D3E3}
.nxt{position:absolute;right:12px;bottom:6px;font-size:11px;color:var(--muted);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}

/* 章タイトル */
.chapcard{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:24px;cursor:pointer;
  background:linear-gradient(160deg,var(--bg2),var(--bg))}
.chapcard .no{font-family:var(--f-code);color:var(--seal);letter-spacing:.2em;font-size:13px;animation:slideL .4s ease both}
.chapcard .big{font-family:var(--f-disp);font-size:34px;line-height:1.25;animation:slideL .5s .1s ease both;text-wrap:balance}
.chapcard .mode{align-self:flex-start;background:var(--weak);color:var(--weakfg);font-weight:900;padding:3px 12px;border-radius:4px;font-size:13px;animation:slideL .5s .25s ease both}
.chapcard .rule{height:4px;background:var(--seal);width:0;animation:grow .6s .2s ease forwards}
@keyframes slideL{from{transform:translateX(-40px);opacity:0}}
@keyframes grow{to{width:60%}}

/* カード入手 */
.getwrap{position:relative;min-height:100%;display:flex;flex-direction:column;justify-content:safe center;align-items:center;gap:14px;cursor:pointer;padding:16px 0 24px}
.getwrap .hd{font-family:var(--f-disp);font-size:22px;color:var(--weak);letter-spacing:.06em}
.evcard{width:min(100%,340px);background:linear-gradient(160deg,#22324F,#18233A);border:2px solid var(--weak);border-radius:12px;padding:14px 16px;animation:flip .5s cubic-bezier(.2,1.2,.4,1) both}
.evcard small{font-family:var(--f-code);font-size:11px;color:var(--weak);letter-spacing:.12em}
.evcard b{display:block;font-size:18px;margin:2px 0 4px}
.evcard span{font-size:14px;color:#C9D3E3}
@keyframes flip{from{transform:perspective(600px) rotateY(80deg) scale(.8);opacity:0}}

/* タイトル */
.title{display:flex;flex-direction:column;gap:14px;padding-top:8px}
.logo{position:relative;border-radius:14px;padding:26px 18px 20px;overflow:hidden;background:
  repeating-linear-gradient(-45deg,transparent 0 14px,rgba(255,210,63,.06) 14px 28px),linear-gradient(160deg,#1E2E52,#0F1626)}
.logo .k{padding-right:74px;font-family:var(--f-code);font-size:11.5px;letter-spacing:.18em;color:var(--weak)}
.logo h1{font-family:var(--f-disp);font-weight:400;font-size:46px;line-height:1.08;margin:8px 0 6px;text-shadow:4px 4px 0 var(--seal)}
.logo .st{position:absolute;right:14px;top:16px;transform:rotate(12deg);border:3px double var(--seal);color:var(--seal);font-family:var(--f-disp);padding:0 10px;font-size:22px;border-radius:6px}
.cases{display:grid;gap:10px}
.casecard{position:relative;text-align:left;border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;min-height:92px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;overflow:hidden;
  background:linear-gradient(90deg,rgba(13,19,31,.95) 40%,rgba(13,19,31,.35)),var(--bgi,linear-gradient(135deg,#22324F,#18233A)) 70% 40%/cover no-repeat}
.casecard .no{font-family:var(--f-code);font-size:11px;letter-spacing:.16em;color:var(--seal);font-weight:700}
.casecard b{font-size:18px;font-weight:900}
.casecard small{font-size:12.5px;color:var(--muted)}
.casecard:hover,.casecard:focus-visible{border-color:var(--weak)}

.t2{position:absolute;inset:0;display:flex;flex-direction:column;gap:14px;padding-top:6px}
.t2logo{animation:slideL .5s ease both}
.t2logo .k{font-family:var(--f-code);font-size:11.5px;letter-spacing:.2em;color:var(--weak)}
.t2logo h1{font-family:var(--f-disp);font-weight:400;font-size:clamp(38px,11vw,52px);line-height:1.05;margin:4px 0 0;text-shadow:4px 4px 0 var(--seal)}
.t2rail{flex:1;min-height:0;display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:-16px;padding-inline:16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.t2rail::-webkit-scrollbar{display:none}
.t2card{flex:0 0 78%;max-width:360px;scroll-snap-align:center;position:relative;border:none;border-radius:16px;overflow:hidden;text-align:left;padding:18px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;color:var(--ink);
  background:linear-gradient(180deg,rgba(13,19,31,0) 35%,rgba(13,19,31,.92) 85%),var(--bgi,linear-gradient(160deg,#22324F,#18233A)) center/cover no-repeat;box-shadow:0 10px 28px rgba(0,0,0,.45);
  animation:railIn .7s cubic-bezier(.2,1,.3,1) var(--d) both}
.t2card .no{font-family:var(--f-code);font-size:12px;letter-spacing:.18em;color:var(--weak);font-weight:700}
.t2card b{font-family:var(--f-disp);font-weight:400;font-size:22px;line-height:1.3}
.t2card small{font-size:12.5px;color:#C9D3E3}
.t2card .go{margin-top:8px;align-self:flex-start;background:var(--seal);color:#fff;font-weight:900;font-size:13px;padding:4px 12px;border-radius:999px}
@keyframes railIn{from{transform:translateX(120%);opacity:0}}
.t2dots{display:flex;justify-content:center;gap:6px;flex:0 0 auto}
.t2dots i{width:7px;height:7px;border-radius:50%;background:var(--line);transition:all .2s}
.t2dots i.on{width:20px;border-radius:4px;background:var(--weak)}
.t2foot{display:flex;gap:10px;flex:0 0 auto;padding-bottom:4px}
@media(max-width:400px){#menuBtn .t{display:none}}
#menuBtn{font-size:20px;background:none;border:0;color:inherit;font:inherit;padding:0;cursor:pointer}
.t3card{position:relative}.t3card .clr{position:absolute;top:8px;right:8px;font-family:var(--f-code);font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--weak);color:#1a1a1a;letter-spacing:.06em}
.t3card .clr.no{background:rgba(255,255,255,.14);color:var(--muted)}
.chk{display:grid;gap:6px;margin-top:8px}.chk div{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;line-height:1.5}.chk i{flex:0 0 auto;font-style:normal;font-weight:700;font-size:11px;padding:1px 7px;border-radius:6px;margin-top:2px}.chk .v i{background:var(--seal);color:#fff}.chk .o i{background:rgba(255,255,255,.12);color:var(--muted)}
.mlist{display:grid;gap:8px;margin:6px 0 4px}.mlist button{text-align:left}
.legal{font-size:12.5px;line-height:1.7;color:var(--muted)}.legal b{color:var(--ink)}
/* 大きい文字モード */
body.big{font-size:17px}
body.big .talkbox .line{font-size:19.5px}
body.big .fb{font-size:16.5px}
body.big .evcard span,body.big .cardlist .it span{font-size:15.5px!important}
body.big .opt{font-size:17px}
body.big .daicho{font-size:15.5px}
body.big .line{font-size:clamp(17px,5vw,19px)}
body.big .chk div{font-size:15.5px}
body.big .who small{font-size:13.5px}
.t2foot .btn{flex:1;padding:13px 8px}

.t3{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:14px}
.t3hero{position:relative;flex:0 0 auto;height:min(46vh,100vw);min-height:220px;display:flex;align-items:flex-end;margin-inline:-16px;padding-inline:16px;overflow:hidden;
  background:radial-gradient(80% 70% at 75% 60%,rgba(62,111,216,.35),transparent 70%),repeating-linear-gradient(-45deg,transparent 0 14px,rgba(255,210,63,.05) 14px 28px)}
.t3hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:40%;background:linear-gradient(transparent,var(--bg));pointer-events:none}
.t3hero .t2logo{position:relative;z-index:2;padding-bottom:6px}
.t3art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 30%;max-width:none}
.t3cast{position:absolute;inset:6px 0 0 0;animation:castIn .8s cubic-bezier(.2,1,.3,1) both}
.t3cast img{position:absolute;bottom:0;width:auto;max-width:none;filter:drop-shadow(0 10px 18px rgba(0,0,0,.6))}
.t3cast .c1{height:100%;right:-4%;z-index:3}
.t3cast .c2{height:80%;right:-14%;z-index:2;opacity:.9}
.t3cast .c3{height:84%;left:-12%;z-index:1;opacity:.8}
@keyframes castIn{from{transform:translateX(30%);opacity:0}}
.t3lab span{font-weight:500;font-size:11px;margin-left:6px;opacity:.8}

.t3sel{display:flex;flex-direction:column;gap:8px}
.t3lab{font-size:12.5px;color:var(--muted);font-weight:700;letter-spacing:.06em}
.t3mq{margin-inline:-16px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.t3mq::-webkit-scrollbar{display:none}
.t3track{display:flex;gap:12px;width:max-content;padding:6px 0}
.t3track.hold{animation-play-state:paused}
@keyframes mq{to{transform:translateX(calc(-50% - 6px))}}
.t3card{flex:0 0 auto;width:230px;height:150px;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;text-align:left;padding:12px 14px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;color:var(--ink);
  background:linear-gradient(180deg,rgba(13,19,31,.05) 20%,rgba(13,19,31,.9) 80%),var(--bgi,linear-gradient(160deg,#22324F,#18233A)) center/cover no-repeat}
.t3card:hover,.t3card:focus-visible{border-color:var(--weak)}
.t3card .no{font-family:var(--f-code);font-size:10.5px;letter-spacing:.16em;color:var(--weak);font-weight:700}
.t3card b{font-size:15.5px;font-weight:900;line-height:1.35}
.t3card small{font-size:11.5px;color:#C9D3E3}

.how{display:flex;flex-direction:column;gap:8px}
.how div{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.how b{flex:0 0 4.6em;text-align:center;white-space:nowrap;background:var(--weak);color:var(--weakfg);font-size:11.5px;padding:2px 0;border-radius:4px;margin-top:3px}

/* 判断 */
.opt{display:block;width:100%;text-align:left;background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;font-size:15px}
.opt.sel{border-color:var(--ok);box-shadow:inset 0 0 0 1.5px var(--ok)}
.opts{display:flex;flex-direction:column;gap:8px}

/* 探索 */
.scene{width:100%;height:auto;display:block;border-radius:8px;background:#22304A;touch-action:manipulation}
.scene .ln{stroke:#D7E0EE;stroke-width:1.6;fill:none;stroke-linejoin:round;stroke-linecap:round}
.scene .fl{fill:#2E3F60;stroke:#D7E0EE;stroke-width:1.6}
.scene .fd{fill:#4A5D80;stroke:#D7E0EE;stroke-width:1.4}
.scene .red{fill:var(--seal)}
.scene .tx{fill:#D7E0EE;font-size:9px;font-family:var(--f-body)}
.scene .hs{fill:transparent;cursor:pointer}
.scene .hs.found{stroke:var(--weak);stroke-width:3;stroke-dasharray:6 4;fill:rgba(255,210,63,.12)}
.scene .hs.seen{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:3 3}
.scene .hs.pulse{animation:pulse 1s ease-in-out 4;stroke:var(--weak);stroke-width:3}
@keyframes pulse{50%{fill:rgba(255,210,63,.3)}}
.tabs{display:flex;gap:6px}
.tab{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 3px;font-size:11.5px;font-weight:700;line-height:1.3;white-space:normal;word-break:keep-all;overflow-wrap:anywhere;display:flex;align-items:center;justify-content:center;text-align:center}
.tab.on{border-color:var(--weak);color:var(--weak)}
.prog{display:flex;gap:5px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.prog span{width:20px;height:6px;border-radius:3px;background:var(--line)}
.prog span.on{background:var(--weak)}

/* 台帳 */
.daicho{width:100%;border-collapse:collapse;font-size:13.5px}
.daicho th{text-align:left;color:var(--muted);font-weight:500;width:36%;padding:6px 8px 6px 0;border-bottom:1px solid var(--line);vertical-align:top}
.daicho td{padding:6px 0;border-bottom:1px solid var(--line)}
.daicho td button{all:unset;cursor:pointer;background:var(--weak);color:var(--weakfg);padding:0 5px;border-radius:3px;font-weight:700}
.daicho td button.got{background:transparent;color:var(--ink);text-decoration:underline 2px var(--weak)}

/* ===== ノンストップ議論 ===== */
.arena{position:relative;flex:1;min-height:250px;border-radius:12px;overflow:hidden;background:
  radial-gradient(90% 60% at 50% 40%,color-mix(in srgb,var(--c) 30%,transparent),transparent 70%),
  repeating-conic-gradient(from 0deg at 50% 45%,rgba(255,255,255,.03) 0 6deg,transparent 6deg 12deg),var(--bg2)}
.ahead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ahead h2{font-size:16px;margin-right:auto}
.tbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;flex:0 0 auto}
.tbar i{display:block;height:100%;background:linear-gradient(90deg,var(--seal),var(--weak));transition:width .1s linear}
.tbar.low i{background:var(--seal);animation:blink .5s steps(2) infinite}
.speaker{position:absolute;left:12px;top:12px;display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700}
.speaker .f{width:40px;height:40px;border-radius:10px;background:var(--c);display:grid;place-items:center;font-family:var(--f-disp);font-size:18px;overflow:hidden}
.speaker .f img{width:100%;height:100%;object-fit:cover}
.stmtwrap{position:absolute;inset:60px 10px 38px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.stmt{max-width:100%;font-size:clamp(16px,5vw,21px);font-weight:900;line-height:1.6;text-align:center;overflow-wrap:anywhere;text-shadow:0 2px 0 rgba(0,0,0,.5);text-wrap:balance}
.stmt.in0{animation:sIn0 .45s cubic-bezier(.2,1.2,.4,1)}
.stmt.in1{animation:sIn1 .45s cubic-bezier(.2,1.2,.4,1)}
.stmt.in2{animation:sIn2 .5s cubic-bezier(.2,1.2,.4,1)}

const SND={on:true,ctx:null,
 c(){if(!this.on)return null;try{if(!this.ctx)this.ctx=new (window.AudioContext||window.webkitAudioContext)();if(this.ctx.state==='suspended')this.ctx.resume();return this.ctx}catch(e){return null}},
 tone(f,d,type='square',v=.06,t0=0,f2){const a=this.c();if(!a)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+t0;
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.02)},
 noise(d,v=.15,t0=0,hp=800){const a=this.c();if(!a)return;const b=a.createBuffer(1,a.sampleRate*d,a.sampleRate),ch=b.getChannelData(0);
  for(let i=0;i<ch.length;i++)ch[i]=(Math.random()*2-1)*(1-i/ch.length);const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();
  f.type='highpass';f.frequency.value=hp;g.gain.value=v;s.buffer=b;s.connect(f).connect(g).connect(a.destination);s.start(a.currentTime+t0)},
 blip(){this.tone(1300,.025,'square',.025)},

 el(k){if(!this.els[k]){const a=new Audio(this.src[k]);a.loop=true;a.preload='auto';a.volume=0;this.els[k]=a}return this.els[k]},
 fade(a,to,ms,done){clearInterval(a._f);const from=a.volume,st=performance.now();a._f=setInterval(()=>{const r=Math.min(1,(performance.now()-st)/ms);a.volume=Math.max(0,Math.min(1,from+(to-from)*r));if(r>=1){clearInterval(a._f);done&&done()}},40)},

  const old=this.cur?this.els[this.cur]:null;this.cur=k;
  if(old)this.fade(old,0,600,()=>old.pause());
  const a=this.el(k);a.currentTime=0;const pr=a.play();if(pr&&pr.catch)pr.catch(()=>{});this.fade(a,this.target(),900)},
 unlock(){if(this.unlocked)return;this.unlocked=true;if(this.want)this.play(this.want)},

};

function senpaiHint(){
  const s=STORY[G.i];
  if(s.t==='choice')return {x:s.hint};
  if(s.t==='daicho')return {x:`台帳の黄色い項目は、全部あとで効いてくる。${s.need.length}つとも拾っておけ。`,free:1};
  if(s.t==='rush')return {x:s.hint,free:1};
  if(s.t==='explore'){
    for(const k of s.sc){const p=SCENES[k].spots.find(q=>q.card&&!G.cards.has(q.card));
      if(p){G.ex.cur=k;render();const el=stage.querySelector(`.hs[data-id="${p.id}"]`);if(el)el.classList.add('pulse');
        return {x:`「${SCENES[k].name}」の光っているあたりを、もう一度よく見てみろ。`}}}
    return {x:'もう全部見つけてる。先に進め。',free:1};
  }
  if(s.t==='cross'){const X=CROSS[s.id],st=G.cx;
    const pk=X.lines.findIndex(l=>l.pressGet&&!l.pressGet.every(c=>G.cards.has(c)));if(pk>=0)return {x:`${pk+1}番目の証言を「追及」してみろ。何か隠してるぞ。`};
    const L=X.lines[st.li];
    if(!L.ans||st.solved.has(st.li)){const k=X.lines.findIndex((l,i)=>l.ans&&!st.solved.has(i));return {x:`${k+1}番目の証言が怪しい。そこでつきつけろ。`,free:1}}
    return {x:L.hint+`<br><br><b>つきつけるのは「${CARDS[ans1(L)].n}」だ。</b>`};
  }
  if(s.t==='debate'){const D=DEBATES[s.id],st=G.db;
    const k=D.lines.findIndex((l,i)=>l.ans&&!st.solved.has(i));if(k<0)return {x:'もう十分だ。',free:1};
    const L=D.lines[k],A=ans1(L);st.sel=A;
    return {x:`${k+1}番目の発言だ。${L.hint}<br><br><b>撃ち込むのは「${CARDS[A].n}」。装填しておいたぞ。</b>`,after:()=>{st.showFn&&st.showFn(k);$('#ld')&&($('#ld').innerHTML=loadedHTML(A));stage.querySelectorAll('.cd').forEach(b=>b.classList.toggle('sel',b.dataset.c===A))}};
  }
  return null;
}

  stage.innerHTML=`<div class="panel" style="display:flex;gap:18px;align-items:center"><div class="rank" style="font-size:60px">${DR.score}</div><div><div class="eyebrow">${nb?'自己ベスト更新！':'タイムアップ'}</div><div style="font-size:14px">正解 ${DR.ok}/${DR.n}（${rate}%）・最大連続 ${DR.maxS}<br>自己ベスト ${Math.max(best,DR.score)}点</div></div></div>
  <div class="panel">${whoHTML('mun',DR.miss.length?'間違えたところだけ見直しておけ。特に「特定」かどうかは、点検報告や防火管理者の基準に直結するぞ。':'全問正解か。別表第一は体に入ってるな。',DR.miss.length?'n':'hint')}</div>
  ${DR.miss.length?`<div class="panel"><div class="eyebrow">見直しリスト</div><div class="cardlist" style="margin-top:8px">${DR.miss.map(([x,a,k])=>`<div class="it"><b>${x}</b><span style="font-size:13.5px">正解 <b style="display:inline;color:var(--weak)">${kouLabel(a)}</b> ${KOU_NAME[a]}（${TOKUTEI.has(a)?'特定':'非特定'}）／あなたの答え ${kouLabel(k)}</span></div>`).join('')}</div></div>`:''}
  <div class="ctrl"><button class="btn weak grow" id="dAgain" type="button">もう一度</button><button class="btn ghost grow" id="dTop" type="button">タイトルへ</button></div>`;
  $('#dAgain').onclick=()=>{SND.tap();drillStart()};
  $('#dTop').onclick=()=>{SND.tap();reset();render()};
}

render();
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>

</html>
